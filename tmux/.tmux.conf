# Recommended tmux configuration

# Primary prefix: Ctrl+Space. Keep Ctrl+B as fallback.
unbind C-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix

# Use 256 colors and advertise RGB support for common macOS terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB,kitty:RGB,ghostty:RGB,alacritty:RGB,wezterm:RGB,xterm-256color:RGB'

# Improve modifier key handling in terminal emulators on macOS.
set -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u

# Set history limit
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Share tmux copy buffer with system clipboard
set -g set-clipboard on

# Better focus handling for nvim and shells
set -g focus-events on

# Window and pane numbering starts at 1 (easier to navigate)
set -g base-index 1
setw -g pane-base-index 1

# Automatic window renaming
setw -g automatic-rename on
set -g set-titles on

# Faster key repetition
set -s escape-time 0

# Better split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easy pane navigation with vim keys
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number for direct pane selection
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# Pane resizing (with prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Alt+arrow for faster resizing (no prefix needed)
bind -n M-Left resize-pane -L 10
bind -n M-Right resize-pane -R 10
bind -n M-Up resize-pane -U 10
bind -n M-Down resize-pane -D 10

# Window navigation
bind -r H previous-window
bind -r L next-window
bind -r p previous-window
bind -r n next-window
bind Tab last-window
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Charcoal and muted violet. Matching tab shapes, stronger focus, useful context.
set -g status-position bottom
set -g status-style 'bg=#18181b,fg=#a1a1aa'
set -g status-interval 15
set -g status-left-length 24
set -g status-right-length 45
set -g status-left '#[bg=#b4a0e5,fg=#18181b,bold] #{=16:session_name} #[default]  '
set -g status-right '#[fg=#b4a0e5,bold]#{?client_prefix, PREFIX ,}#{?window_zoomed_flag, ZOOM ,}#[default] #{window_panes} panes #[fg=#52525b]│#[fg=#d4d4d8] %a %H:%M '
set -g status-justify left
setw -g window-status-separator ' '
setw -g window-status-format ' #I │ #{=14:window_name} #{?window_bell_flag,!,#{?window_activity_flag,•, }} '
setw -g window-status-current-format ' #I │ #{=14:window_name} #{?window_bell_flag,!,#{?window_activity_flag,•, }} '
setw -g window-status-style 'bg=#27272a,fg=#a1a1aa'
setw -g window-status-current-style 'bg=#b4a0e5,fg=#18181b,bold'
setw -g window-status-activity-style 'bg=#27272a,fg=#b4a0e5'
setw -g window-status-bell-style 'bg=#27272a,fg=#e0a3c2,bold'
setw -g monitor-activity on
set -g activity-action none
set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g pane-border-style 'fg=#52525b'
set -g pane-active-border-style 'fg=#b4a0e5'
setw -g pane-border-lines heavy
setw -g pane-border-indicators off
setw -g pane-border-status top
setw -g pane-border-format ''
set -g message-style 'bg=#27272a,fg=#f4f4f5'
set -g message-command-style 'bg=#27272a,fg=#f4f4f5'
setw -g mode-style 'bg=#b4a0e5,fg=#18181b'
set -g display-time 2000
set -g display-panes-time 1500
set -g display-panes-colour '#a1a1aa'
set -g display-panes-active-colour '#b4a0e5'

# Stable window numbers; rename important windows with prefix + comma.
set -g renumber-windows off
setw -g allow-rename off
bind w choose-tree -Zw
# Toggle top border rows consistently across all windows.
bind b set -gwF pane-border-status "#{?#{==:#{pane-border-status},off},top,off}"

# Vim-style copying; terminal applications retain control of their cursor.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# Reload the installed configuration.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
