# Recommended tmux configuration

# Primary prefix: Ctrl+Space. Keep Ctrl+B as fallback.
unbind C-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix

# Use 256 colors and advertise RGB support for common macOS terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',kitty:RGB,ghostty:RGB,alacritty:RGB,wezterm:RGB,xterm-256color:RGB'

# Improve modifier key handling in terminal emulators on macOS.
set -g xterm-keys on

# Set history limit
set -g history-limit 10000

# Enable mouse support
set -g mouse on

# Share tmux copy buffer with system clipboard
set -g set-clipboard on

# Better focus handling for nvim and shells
set -g focus-events on

# Window and pane numbering starts at 1 (easier to navigate)
set -g base-index 1
setw -g pane-base-index 1

# Automatic window renaming
setw -g automatic-rename on
set -g set-titles on

# Faster key repetition
set -s escape-time 0

# Better split commands
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easy pane navigation with vim keys
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number for direct pane selection
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9
bind -n M-0 select-pane -t 0

# Pane resizing (with prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Alt+arrow for faster resizing (no prefix needed)
bind -n M-Left resize-pane -L 10
bind -n M-Right resize-pane -R 10
bind -n M-Up resize-pane -U 10
bind -n M-Down resize-pane -D 10

# Window navigation
bind -r H previous-window
bind -r L next-window
bind -r p previous-window
bind -r n next-window
bind Tab last-window
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar styling
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g status-left-length 32
set -g status-right-length 64
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#11111b,nobold]"
set -g status-right "#[fg=#f9e2af,bg=#11111b] %Y-%m-%d #[fg=#89b4fa,bg=#11111b] %H:%M "
set -g status-interval 60

# Highlight active window
set -g window-status-format "#[fg=#6c7086,bg=#11111b] #I #W "
set -g window-status-current-format "#[fg=#11111b,bg=#a6e3a1,bold] #I #W "
set -g window-status-current-style "fg=#11111b,bg=#a6e3a1,bold"
set -g window-status-style "fg=#cdd6f4,bg=#11111b"

# Pane border colors
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af"
set -g message-style "fg=#11111b,bg=#89b4fa"
set -g mode-style "fg=#11111b,bg=#f9e2af"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# Cursor style - change to vertical bar/line
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
